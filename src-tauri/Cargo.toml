[package]
name = "forge"
version = "0.1.0"
description = "Forge"
edition = "2021"

[lib]
name = "forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
